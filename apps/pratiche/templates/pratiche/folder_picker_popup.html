<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Securtek</title>
    <style>
        :root {
            --st-bg: #f5f7fb;
            --st-card: #ffffff;
            --st-text: #1f2937;
            --st-muted: #64748b;
            --st-primary: #1d4ed8;
            --st-border: #e2e8f0;
            --st-danger: #b42318;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: var(--st-bg);
            color: var(--st-text);
            display: grid;
            place-items: center;
            padding: 1rem;
        }
        .panel {
            width: min(100%, 22rem);
            background: var(--st-card);
            border: 1px solid var(--st-border);
            border-radius: 0.85rem;
            padding: 1.5rem 1.35rem 1.35rem;
            text-align: center;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        .brand {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--st-primary);
            margin: 0 0 1rem;
        }
        .spinner {
            width: 1.75rem;
            height: 1.75rem;
            margin: 0 auto 1rem;
            border: 2.5px solid #dbeafe;
            border-top-color: var(--st-primary);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        .spinner.is-done {
            animation: none;
            border-color: #bbf7d0;
            border-top-color: #16a34a;
            background: #16a34a;
            box-shadow: inset 0 0 0 3px #fff;
        }
        .spinner.is-error {
            animation: none;
            border-color: #fecaca;
            border-top-color: var(--st-danger);
            background: transparent;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 0.35rem;
            letter-spacing: -0.01em;
        }
        #status {
            margin: 0;
            color: var(--st-muted);
            font-size: 0.9rem;
            line-height: 1.45;
        }
        #error {
            margin: 0.85rem 0 0;
            padding: 0.65rem 0.75rem;
            border-radius: 0.5rem;
            background: #fef2f2;
            color: var(--st-danger);
            font-size: 0.82rem;
            line-height: 1.4;
            text-align: left;
        }
        #error[hidden] { display: none; }
        .actions {
            margin-top: 1rem;
            display: none;
        }
        .actions.is-visible { display: block; }
        .actions button {
            appearance: none;
            border: 1px solid var(--st-border);
            background: #fff;
            color: var(--st-text);
            border-radius: 0.5rem;
            padding: 0.45rem 0.9rem;
            font: inherit;
            font-size: 0.88rem;
            cursor: pointer;
        }
        .actions button:hover {
            background: #f8fafc;
        }
    </style>
</head>
<body>
    <div class="panel" role="status" aria-live="polite">
        <p class="brand">SECURTEK</p>
        <div class="spinner" id="spinner" aria-hidden="true"></div>
        <h1 id="title">Selezione cartella</h1>
        <p id="status">In corso…</p>
        <p id="error" hidden></p>
        <div class="actions" id="actions">
            <button type="button" id="closeBtn">Chiudi</button>
        </div>
    </div>
    <script>
    (function () {
        "use strict";

        var pickerUrl = "{{ picker_api_url|escapejs }}";
        var openerOrigin = "{{ opener_origin|escapejs }}";
        var titleEl = document.getElementById("title");
        var statusEl = document.getElementById("status");
        var errorEl = document.getElementById("error");
        var spinnerEl = document.getElementById("spinner");
        var actionsEl = document.getElementById("actions");
        var closeBtn = document.getElementById("closeBtn");

        closeBtn.addEventListener("click", function () {
            window.close();
        });

        function finish(payload, delayMs) {
            if (window.opener && !window.opener.closed) {
                try {
                    window.opener.postMessage(payload, openerOrigin);
                } catch (e) {
                    /* ignore */
                }
            }
            window.setTimeout(function () {
                window.close();
            }, delayMs || 160);
        }

        function fail(message) {
            spinnerEl.classList.add("is-error");
            titleEl.textContent = "Selezione non riuscita";
            statusEl.textContent = "Riprova dalla pratica oppure chiudi questa finestra.";
            errorEl.hidden = false;
            errorEl.textContent = message;
            actionsEl.classList.add("is-visible");
            finish({ type: "securtek-folder-picked", path: "", error: message, cancelled: false }, 400);
        }

        fetch(pickerUrl, {
            method: "GET",
            credentials: "same-origin",
            headers: {
                "X-Requested-With": "XMLHttpRequest",
                "Accept": "application/json",
            },
        }).then(function (response) {
            var contentType = response.headers.get("content-type") || "";
            if (contentType.indexOf("application/json") === -1) {
                throw new Error("Sessione scaduta. Effettua di nuovo il login.");
            }
            return response.json().then(function (data) {
                if (!response.ok || data.error) {
                    throw new Error(data.error || "Impossibile aprire il selettore cartella.");
                }
                spinnerEl.classList.add("is-done");
                if (data.path) {
                    titleEl.textContent = "Cartella selezionata";
                    statusEl.textContent = "Chiusura in corso…";
                } else {
                    titleEl.textContent = "Selezione annullata";
                    statusEl.textContent = "Nessuna cartella scelta.";
                }
                finish({
                    type: "securtek-folder-picked",
                    path: data.path || "",
                    cancelled: !!data.cancelled || !data.path,
                });
            });
        }).catch(function (error) {
            fail((error && error.message) || "Impossibile aprire il selettore cartella.");
        });
    })();
    </script>
</body>
</html>
