<div class="page-header d-print-none mb-3">
    <div class="row align-items-center">

        <div class="col">
            <h2 class="page-title">
                {{ title }}
            </h2>

            {% if subtitle %}
                <div class="text-secondary">
                    {{ subtitle }}
                </div>
            {% endif %}
        </div>

        <div class="col-auto">
            {{ actions|safe }}
        </div>

    </div>
</div>
